<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Debate Bot</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* إضافة تحسينات بسيطة لزيادة التفاعل */
    .container {
      max-width: 600px;
      margin: 50px auto;
      text-align: center;
    }

    textarea {
      width: 100%;
      padding: 10px;
      margin: 20px 0;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      resize: none;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
    }

    button:hover {
      background-color: #45a049;
    }

    #responseBox {
      margin-top: 20px;
      padding: 10px;
      background-color: #f1f1f1;
      border-radius: 8px;
      min-height: 50px;
    }

    /* Loading indicator */
    .loading {
      color: #ff9800;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Debate Bot</h1>
    <textarea id="userInput" placeholder="اكتب سؤالك هنا..." rows="4"></textarea>
    <button onclick="sendQuestion()">أرسل</button>
    <div id="responseBox" class="response-box"></div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
